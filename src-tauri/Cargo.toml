[package]
name = "dynamic-island-copilot"
version = "0.1.0"
description = "Ultra-lightweight Dynamic Island for Windows 11 & macOS"
authors = ["jean"]
edition = "2021"

[lib]
name = "dynamic_island_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dirs = "5"
